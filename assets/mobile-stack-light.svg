<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 790" width="100%" role="img" aria-labelledby="tikml dekml">
<title id="tikml">Stack</title>
<desc id="dekml">Stack, 32 modules. Ai: LLMs, RAG, LangGraph, LangChain, browser-use, structured outputs, evals, Langfuse, OpenTelemetry, pgvector. Backend: Python, TypeScript, FastAPI, Flask, Celery, Redis, PostgreSQL, Playwright. Infra: Azure AKS, Kubernetes, Terraform, Helmfile, Docker, GitHub Actions, Grafana, Loki, Prometheus, Sentry. Frontend: React, Next.js, Tailwind, tRPC.</desc>
<style>
svg,text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
text{white-space:pre}
.t{fill:#0b1220}.d{fill:#45505f}.c{fill:#0e7490}.m{fill:#a21caf}.g{fill:#4d7c0f}
.b{font-weight:700}
.static{display:none}
.scan{animation:scan 7s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.rise{animation:rise .7s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
.growy{transform-box:fill-box;transform-origin:center bottom;animation:growy 1.2s cubic-bezier(.2,.8,.2,1) both}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite reverse}
.glc{animation:glc 5.5s steps(1) infinite}
.glm{animation:glm 5.5s steps(1) infinite}
.gls{animation:gls 5.5s steps(1) infinite}
@keyframes scan{from{transform:translateY(-24px)}to{transform:translateY(790px)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glc{0%,88%,100%{opacity:0;transform:none}89%{opacity:.85;transform:translate(-5px,1px)}91%{opacity:.85;transform:translate(4px,-1px)}93%{opacity:.85;transform:translate(-2px,0)}95%{opacity:0}}
@keyframes glm{0%,88%,100%{opacity:0;transform:none}89%{opacity:.85;transform:translate(5px,-1px)}91%{opacity:.85;transform:translate(-4px,2px)}93%{opacity:.85;transform:translate(3px,0)}95%{opacity:0}}
@keyframes gls{0%,90%,100%{opacity:0;transform:none}90.5%{opacity:1;transform:translateX(14px)}92%{opacity:1;transform:translateX(-9px)}93.5%{opacity:0}}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.typed,.scanbar{display:none}
.static{display:inline}
}
</style>
<defs>
<pattern id="gridkml" width="24" height="24" patternUnits="userSpaceOnUse">
<path d="M24 0H0V24" fill="none" stroke="#0e7490" stroke-opacity="0.07" stroke-width="1"/>
</pattern>
<pattern id="lineskml" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="4" height="1" fill="#0e7490" fill-opacity="0.035"/>
</pattern>
<linearGradient id="scankml" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0e7490" stop-opacity="0"/>
<stop offset="1" stop-color="#0e7490" stop-opacity="0.04"/>
</linearGradient>
<radialGradient id="vigkml" cx="50%" cy="45%" r="75%">
<stop offset="0.6" stop-color="#f5f7fb" stop-opacity="0"/>
<stop offset="1" stop-color="#f5f7fb" stop-opacity="0.65"/>
</radialGradient>
<filter id="glowkml" x="-20%" y="-40%" width="140%" height="180%">
<feGaussianBlur stdDeviation="3.2" result="b"/>
<feComponentTransfer in="b" result="bb"><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
<feMerge><feMergeNode in="bb"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<clipPath id="framekml"><rect x="1" y="1" width="598" height="788" rx="14"/></clipPath>
</defs>
<g clip-path="url(#framekml)">
<rect width="600" height="790" fill="#f5f7fb"/>
<rect width="600" height="790" fill="url(#gridkml)"/>
<rect width="600" height="790" fill="url(#lineskml)"/>

<text x="32" y="50" font-size="22" class="c b" letter-spacing="2">◢ STACK</text>
<text x="568" y="50" font-size="20" text-anchor="end" class="d"><tspan class="g b">32</tspan> MODULES</text>
