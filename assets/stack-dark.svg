<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 438" width="100%" role="img" aria-labelledby="tikd dekd">
<title id="tikd">Stack</title>
<desc id="dekd">Stack, 32 modules. Ai: LLMs, RAG, LangGraph, LangChain, browser-use, structured outputs, evals, Langfuse, OpenTelemetry, pgvector. Backend: Python, TypeScript, FastAPI, Flask, Celery, Redis, PostgreSQL, Playwright. Infra: Azure AKS, Kubernetes, Terraform, Helmfile, Docker, GitHub Actions, Grafana, Loki, Prometheus, Sentry. Frontend: React, Next.js, Tailwind, tRPC.</desc>
<style>
svg,text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
text{white-space:pre}
.t{fill:#e6f1ff}.d{fill:#94a3bd}.c{fill:#22d3ee}.m{fill:#e879f9}.g{fill:#a3e635}
.b{font-weight:700}
.static{display:none}
.scan{animation:scan 7s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.rise{animation:rise .7s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
.growy{transform-box:fill-box;transform-origin:center bottom;animation:growy 1.2s cubic-bezier(.2,.8,.2,1) both}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite reverse}
.glc{animation:glc 5.5s steps(1) infinite}
.glm{animation:glm 5.5s steps(1) infinite}
.gls{animation:gls 5.5s steps(1) infinite}
@keyframes scan{from{transform:translateY(-24px)}to{transform:translateY(438px)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glc{0%,88%,100%{opacity:0;transform:none}89%{opacity:.85;transform:translate(-5px,1px)}91%{opacity:.85;transform:translate(4px,-1px)}93%{opacity:.85;transform:translate(-2px,0)}95%{opacity:0}}
@keyframes glm{0%,88%,100%{opacity:0;transform:none}89%{opacity:.85;transform:translate(5px,-1px)}91%{opacity:.85;transform:translate(-4px,2px)}93%{opacity:.85;transform:translate(3px,0)}95%{opacity:0}}
@keyframes gls{0%,90%,100%{opacity:0;transform:none}90.5%{opacity:1;transform:translateX(14px)}92%{opacity:1;transform:translateX(-9px)}93.5%{opacity:0}}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.typed,.scanbar{display:none}
.static{display:inline}
}
</style>
<defs>
<pattern id="gridkd" width="24" height="24" patternUnits="userSpaceOnUse">
<path d="M24 0H0V24" fill="none" stroke="#22d3ee" stroke-opacity="0.06" stroke-width="1"/>
</pattern>
<pattern id="lineskd" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="4" height="1" fill="#22d3ee" fill-opacity="0.035"/>
</pattern>
<linearGradient id="scankd" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
<stop offset="1" stop-color="#22d3ee" stop-opacity="0.06"/>
</linearGradient>
<radialGradient id="vigkd" cx="50%" cy="45%" r="75%">
<stop offset="0.6" stop-color="#05070d" stop-opacity="0"/>
<stop offset="1" stop-color="#05070d" stop-opacity="0.65"/>
</radialGradient>
<filter id="glowkd" x="-20%" y="-40%" width="140%" height="180%">
<feGaussianBlur stdDeviation="3.2" result="b"/>
<feComponentTransfer in="b" result="bb"><feFuncA type="linear" slope="1"/></feComponentTransfer>
<feMerge><feMergeNode in="bb"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<clipPath id="framekd"><rect x="1" y="1" width="1198" height="436" rx="14"/></clipPath>
</defs>
<g clip-path="url(#framekd)">
<rect width="1200" height="438" fill="#05070d"/>
<rect width="1200" height="438" fill="url(#gridkd)"/>
<rect width="1200" height="438" fill="url(#lineskd)"/>

<text x="40" y="52" font-size="18" class="c b" letter-spacing="2">◢ STACK</text>
<text x="1160" y="52" font-size="15" text-anchor="end" class="d" letter-spacing="1"><tspan class="g b">32</tspan> MODULES LOADED</text>
