s"><rect x="848.7" y="250" width="186.2" height="40" rx="5" fill="#0a101c" stroke="#a3e635" stroke-opacity="0.55"/><text x="941.8" y="276.5" font-size="18" text-anchor="middle" class="t">GitHub Actions</text></g><g class="rise" style="animation-delay:0.58s"><rect x="1045.0" y="250" width="108.1" height="40" rx="5" fill="#0a101c" stroke="#a3e635" stroke-opacity="0.55"/><text x="1099.0" y="276.5" font-size="18" text-anchor="middle" class="t">Grafana</text></g><g class="rise" style="animation-delay:0.61s"><rect x="180.0" y="300" width="74.6" height="40" rx="5" fill="#0a101c" stroke="#a3e635" stroke-opacity="0.55"/><text x="217.3" y="326.5" font-size="18" text-anchor="middle" class="t">Loki</text></g><g class="rise" style="animation-delay:0.64s"><rect x="264.6" y="300" width="141.6" height="40" rx="5" fill="#0a101c" stroke="#a3e635" stroke-opacity="0.55"/><text x="335.4" y="326.5" font-size="18" text-anchor="middle" class="t">Prometheus</text></g><g class="rise" style="animation-delay:0.67s"><rect x="416.2" y="300" width="97.0" height="40" rx="5" fill="#0a101c" stroke="#a3e635" stroke-opacity="0.55"/><text x="464.7" y="326.5" font-size="18" text-anchor="middle" class="t">Sentry</text></g><text x="40" y="384" font-size="15" class="c b" letter-spacing="2">FRONTEND</text><g class="rise" style="animation-delay:0.55s"><rect x="180.0" y="358" width="85.8" height="40" rx="5" fill="#0a101c" stroke="#22d3ee" stroke-opacity="0.55"/><text x="222.9" y="384.5" font-size="18" text-anchor="middle" class="t">React</text></g><g class="rise" style="animation-delay:0.58s"><rect x="275.8" y="358" width="108.1" height="40" rx="5" fill="#0a101c" stroke="#22d3ee" stroke-opacity="0.55"/><text x="329.9" y="384.5" font-size="18" text-anchor="middle" class="t">Next.js</text></g><g class="rise" style="animation-delay:0.61s"><rect x="393.9" y="358" width="119.3" height="40" rx="5" fill="#0a101c" stroke="#22d3ee" stroke-opacity="0.55"/><text x="453.6" y="384.5" font-size="18" text-anchor="middle" cl